name: Caça-Preços Automated Tracker

on:
  workflow_dispatch:
  schedule:
    # 09:00, 14:00, 18:00 no horário de Brasília (UTC-3 -> 12:00, 17:00, 21:00 UTC)
    - cron: '0 12,17,21 * * *'
  push:
    paths:
      - 'products.json'

permissions:
  contents: write
  actions: write

jobs:
  track-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography playwright
          playwright install --with-deps chromium

      - name: Run Tracker
        run: |
          python tracker.py --run-once

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html index.html data.json products.json config.json deals*.md favicon.* || true
          git diff --staged --quiet || git commit -m "update: automatic price tracking sync [skip ci]"
          git push origin main
